apply plugin: 'com.android.application'

// リリース署名の情報。鍵とパスワードは公開リポジトリに入れない。
// android/keystore.properties（git に入れない。storeFile・storePassword・keyAlias・keyPassword）か、
// 環境変数（LATTECHO_STORE_FILE・LATTECHO_STORE_PASSWORD・LATTECHO_KEY_ALIAS・LATTECHO_KEY_PASSWORD）から読む。
// どちらも無いときは、署名しないリリースを作る（CI で、ビルドが通るかだけ確かめるため）
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String key, String envName -> keystoreProps.getProperty(key) ?: System.getenv(envName) }
def releaseStoreFile = signingValue('storeFile', 'LATTECHO_STORE_FILE')
def hasReleaseSigning = releaseStoreFile != null
if (hasReleaseSigning) {
    // 設定が一部だけのとき（パスワードの書き忘れなど）は、どれが足りないか分かるように止める
    [storePassword: 'LATTECHO_STORE_PASSWORD', keyAlias: 'LATTECHO_KEY_ALIAS', keyPassword: 'LATTECHO_KEY_PASSWORD'].each { key, envName ->
        if (!signingValue(key, envName)) {
            throw new GradleException("リリース署名の設定が足りません：${key}（keystore.properties か、環境変数 ${envName}）")
        }
    }
} else if (project.hasProperty('requireSigning')) {
    // Google Play に上げるリリースは、-PrequireSigning を付けて作る。鍵を置き忘れても、署名なしの AAB が黙ってできないように
    throw new GradleException('リリース署名の鍵がありません：android/keystore.properties か、環境変数 LATTECHO_STORE_FILE を設定してください')
}

// Play は、versionCode が前より大きい整数でないと受け付けない。-PversionName と取り違えた値（1.1 など）は、ここで止める
def versionCodeValue = (findProperty('versionCode') ?: '1').toString()
if (!(versionCodeValue ==~ /[1-9][0-9]*/)) {
    throw new GradleException("versionCode は 1 以上の整数にしてください（指定：${versionCodeValue}）")
}

android {
    namespace = "me.makimura.lattecho"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "me.makimura.lattecho.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Google Play に上げるたびに、versionCode を前より大きくする必要がある。
        // ビルドのときに -PversionCode=2 -PversionName=1.1 で渡す（無ければ 1 と 1.0）
        versionCode(versionCodeValue.toInteger())
        versionName((findProperty('versionName') ?: '1.0').toString())
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue('storePassword', 'LATTECHO_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'LATTECHO_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'LATTECHO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // 動画の画質をそろえる（VideoTranscoderPlugin）
    implementation "androidx.media3:media3-transformer:1.10.1"
    implementation "androidx.media3:media3-effect:1.10.1"
    implementation "androidx.media3:media3-common:1.10.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
